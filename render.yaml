services:
  - type: web
    name: drone3d
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install ".[web]"
    startCommand: uvicorn drone3d.render_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DRONE3D_DATA
        value: /var/data
    disk:
      name: drone3d-data
      mountPath: /var/data
      sizeGB: 10