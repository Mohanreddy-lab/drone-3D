[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone3d"
version = "0.1.0"
description = "Single-pass drone video + GPS telemetry to georeferenced, measurable 3D model (prototype)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pycolmap>=3.12",
    "pyproj>=3.6",
    "laspy>=2.5",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
drone3d = "drone3d.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drone3d"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's File()/Form() defaults are the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# SRT fixtures are verbatim drone output; wrapping them would change the format.
"tests/test_telemetry.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
